[pytest]
testpaths = tests
addopts = -q -m "not live"

markers =
    live: needs a real AI provider and network. Excluded by default.

# WHY THE SPLIT
#
# The suite reached twenty-one minutes, almost all of it waiting on a rate-limited API.
# A twenty-one minute test suite is one nobody runs, and a suite nobody runs protects
# nothing.
#
#   pytest              the fast checks. Under a second. Run this constantly.
#   pytest -m live      the live-provider checks. Run before a commit that touches
#                       prompts or providers, and before submitting.
#   pytest -m ""        everything.
